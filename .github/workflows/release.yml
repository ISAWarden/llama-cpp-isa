name: Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Publish a prerelease after all builds succeed
        type: boolean
        default: false
        required: true
  push:
    branches: [main, master]
    paths:
      - llama.cpp
      - patches/**
      - configure.py
      - .github/workflows/release*.yml
      - .github/scripts/**

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - name: Check generated workflow matches pinned upstream
        run: python .github/scripts/generate-build-workflow.py --check
      - name: Test release packaging
        run: python .github/scripts/test-release.py
      - name: Prepare all patches and verify all/none round trip
        id: source
        run: python .github/scripts/prepare-release.py
      - uses: actions/upload-artifact@v6
        with:
          name: patched-source
          path: patched-source.tar.gz
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - uses: actions/upload-artifact@v6
        with:
          name: release-metadata
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  builds:
    needs: prepare
    uses: ./.github/workflows/release-builds.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}

  package:
    needs: [prepare, builds]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - uses: actions/download-artifact@v7
        with:
          pattern: llama*
          path: artifact
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          pattern: cudart-*
          path: artifact
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          name: llama-ui.zip
          path: ui-dist
      - uses: actions/download-artifact@v7
        with:
          name: release-metadata
      - name: Merge upstream packages and generate verified download links
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python .github/scripts/package-release.py
      - uses: actions/upload-artifact@v6
        with:
          name: release-bundle
          path: |
            release/*
            release-notes.md
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    if: github.event_name == 'push' || inputs.create_release
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-bundle
      - name: Publish complete prerelease
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > is-draft.txt; then
            if [[ "$(cat is-draft.txt)" != true ]]; then
              echo "Release already published; leaving its assets unchanged."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" --notes-file release-notes.md --prerelease --draft
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --notes-file release-notes.md --draft=false
